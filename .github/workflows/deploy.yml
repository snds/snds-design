name: Deploy

# Builds the static site and deploys it. Default target is GitHub Pages
# (works today). The build output (apps/site/dist) is a portable static
# bundle, so swapping to Infomaniak/Bunny later only changes the deploy step
# (see the commented Infomaniak job at the bottom) — not the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Quality gate (1/2): component-level a11y + unit tests for @snds/ui.
      # Fast, no browser needed (jsdom + axe-core). Runs before build.
      - name: Component a11y tests
        run: npm run test
      # Inject the licensed Berkeley Mono woff2 from encrypted secrets so the
      # live site renders correctly — without the font living in the repo.
      - name: Restore licensed fonts
        run: |
          mkdir -p apps/site/public/fonts/berkeley-mono
          printf '%s' "$BM_REGULAR" | base64 -d > apps/site/public/fonts/berkeley-mono/BerkeleyMonoVariable-Regular.woff2
          printf '%s' "$BM_ITALIC" | base64 -d > apps/site/public/fonts/berkeley-mono/BerkeleyMonoVariable-Italic.woff2
          # Tungsten Compressed (display headings), subset woff2 — only if the
          # secret is set; otherwise headings fall back to Berkeley Mono.
          mkdir -p apps/site/public/fonts/tungsten
          if [ -n "$TUNGSTEN_SEMIBOLD" ]; then
            printf '%s' "$TUNGSTEN_SEMIBOLD" | base64 -d > apps/site/public/fonts/tungsten/TungstenCompressed-Semibold.woff2
          fi
        env:
          BM_REGULAR: ${{ secrets.BM_REGULAR_WOFF2 }}
          BM_ITALIC: ${{ secrets.BM_ITALIC_WOFF2 }}
          TUNGSTEN_SEMIBOLD: ${{ secrets.TUNGSTEN_SEMIBOLD_WOFF2 }}
      - run: npm run build
      # Quality gate (2/2): page-level a11y. Playwright boots its bundled
      # Chromium, serves the built dist via `astro preview`, and runs axe over
      # every route in both themes. A violation fails this job, so the artifact
      # below never uploads and the dependent `deploy` job is skipped — gating
      # the deploy.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Page a11y scan (axe on built site)
        run: npm run test:a11y
      # NOTE: deploying to a project subpath (user.github.io/repo) requires
      # `base: '/repo/'` in astro.config.mjs. For a custom domain at the root
      # (snds.design) keep base '/' and add a CNAME file in apps/site/public/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

